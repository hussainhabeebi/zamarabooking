name: PhonePe PG V2 isolated release checks
on:
  pull_request:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/admin/**"
      - "apps/web/app/checkout/**"
      - "packages/db/**"
      - "scripts/phonepe-test-network.mjs"
      - "scripts/phonepe-sandbox-acceptance.mjs"
      - "docs/phonepe-*.md"
      - "tests/phonepe/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/phonepe-safety-ci.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:9
      API_BASE_URL: http://127.0.0.1:9
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: TypeScript
        run: |
          node node_modules/typescript/bin/tsc --noEmit -p apps/api/tsconfig.json
          node node_modules/typescript/bin/tsc --noEmit -p apps/admin/tsconfig.json
          node node_modules/typescript/bin/tsc --noEmit -p apps/web/tsconfig.json
          node node_modules/typescript/bin/tsc --noEmit -p packages/db/tsconfig.json
      - name: Mock payment and supplier regression tests
        run: |
          node --import ./scripts/phonepe-test-network.mjs --import ./packages/db/node_modules/tsx/dist/loader.mjs --test apps/api/test/phonepe.test.ts apps/api/test/wallet-recharge.test.ts apps/api/test/fx.test.ts apps/api/test/tripjack-reviewed-total.test.ts apps/api/test/phonepe-sandbox-script.test.ts
          node --import ./scripts/phonepe-test-network.mjs --test packages/suppliers/test/*.test.cjs
      - name: Admin validation build (never deployed)
        run: node apps/admin/node_modules/next/dist/bin/next build apps/admin

  d1:
    name: Local D1 ledger concurrency and migration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Neon schema and migrations are unchanged by the PhonePe release
        run: git diff --exit-code "origin/${{ github.base_ref }}" -- packages/db
      - name: PhonePe store against local workerd D1 with the production migration (no account, no network)
        run: node --import ./scripts/phonepe-test-network.mjs --import ./packages/db/node_modules/tsx/dist/loader.mjs --test apps/api/test/phonepe-d1.test.ts
  rendered-admin:
    name: Rendered Admin QA with local mocked APIs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:9
      API_BASE_URL: http://127.0.0.1:9
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm }
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec playwright install --with-deps chromium
      - run: node apps/admin/node_modules/next/dist/bin/next build apps/admin
      - name: Render mock-only Admin and test controls at five widths
        run: pnpm exec playwright test --config tests/phonepe/playwright.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phonepe-admin-local-fixture-qa
          path: |
            test-results/
            phonepe-qa-report/
          retention-days: 7

name: Live journey search and checkout check (no booking)

# Searches round trip and multi-city on the live website, picks one fare per leg and
# opens checkout to read the Baggage card. Never submits travellers, books or pays.
# No secrets are used.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Akbar stop counts in live search results (read-only)
        run: node scripts/akbar-stops-diagnostic.mjs https://api.zamrabooking.com
        continue-on-error: true
      - name: Akbar round-trip fares found at booking (non-transactional)
        if: always()
        run: node scripts/akbar-roundtrip-book-check.mjs https://api.zamrabooking.com
      - name: Website journey search and checkout baggage
        env:
          CHECK_CHECKOUT: '1'
        run: |
          npm install --prefix "$RUNNER_TEMP/live-qa" --no-save --ignore-scripts @playwright/test@1.64.1
          node "$RUNNER_TEMP/live-qa/node_modules/playwright/cli.js" install --with-deps chromium
          node apps/web/test/journey-live-browser.cjs "$RUNNER_TEMP/live-qa" https://zamrabooking.com
      - name: Stops filter on the live website (search only)
        if: always()
        run: node apps/web/test/stops-live-browser.cjs "$RUNNER_TEMP/live-qa" https://zamrabooking.com
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-journey-screenshots
          path: '*-live-*.png'
          if-no-files-found: ignore
